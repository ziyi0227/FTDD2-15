server:
  port: 6666

admin:
  username: ftdd2
  password: 123456

spring:
  datasource:
    username: root
    password: root
    url: jdbc:mysql:///ft_demo
  data:
    redis:
      host: localhost
      port: 6379
  neo4j:
    uri: bolt://localhost:7687
    authentication:
      username: neo4j
      password: 12345678

logging:
  level:
    com.ftdd2: debug


# 驼峰命名转下划线命名
mybatis:
  configuration:
    map-underscore-to-camel-case: true

sky:
  jwt:
        # 设置jwt签名加密时使用的秘钥
      admin-secret-key: moying
      # 设置jwt过期时间
      admin-ttl: 720000
      # 设置前端传递过来的令牌名称
      admin-token-name: token
  alioss:
      endpoint: ${sky.alioss.endpoint}
      access-key-id: ${sky.alioss.access-key-id}
      access-key-secret: ${sky.alioss.access-key-secret}
      bucket-name: ${sky.alioss.bucket-name}

